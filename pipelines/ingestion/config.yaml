# Reference only — not loaded by the app at runtime. Source of truth: .env / config.py.
# Ingestion config values, kept here to see in one place.

chunking:
  # Token-bounded via Docling's HybridChunker, not character/separator-based splitting.
  max_tokens: 512          # CHUNK_MAX_TOKENS — should match the active embedder's own token ceiling
  tokenizer: bge-large-en-v1.5  # matches FASTEMBED_MODEL, not an independent approximation

table_structure:
  mode: accurate            # TABLE_STRUCTURE_MODE — "accurate" | "fast"
  ocr_enabled: false         # PDF_ENABLE_OCR — off for born-digital PDFs

captioning:
  enabled: true              # PDF_DESCRIBE_IMAGES
  model: ministral-14b-2512  # MISTRAL_VISION_MODEL
  min_interval_seconds: 2.0  # CAPTION_MIN_INTERVAL_SECONDS — respects a per-second provider limit
  skip_classes: ""           # PICTURE_SKIP_CLASSES — comma-separated classifier labels to skip

vector_db:
  collection: omnirag_collection  # QDRANT_COLLECTION
  dense_dim: 1024
  distance: cosine

debug:
  dump_enabled: true          # INGEST_DEBUG_DUMP — writes raw document content to disk, off before public deploy
  dump_dir: logs/ingest_debug # INGEST_DEBUG_DIR