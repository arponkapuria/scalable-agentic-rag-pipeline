<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocRAG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E4E1D9;
    --text: #1C1B1A;
    --text-dim: #6F6B62;
    --intake: #df6519;    /* fetching / parsing */
    --embed: #9B6BD9;     /* embedding */
    --index: #3BAE8C;     /* indexing / complete */
    --fail: #e0433e;      /* failed */
    --idle: #C9C4B8;      /* pending / neutral */
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.1rem 1.5rem .9rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header p {
    margin: .2rem 0 0;
    font-size: .8rem;
    color: var(--text-dim);
  }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ---------- Chat column ---------- */
  #chat-col {
    flex: 1 1 65%;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border);
  }
  #chat-desc {
    font-size: .78rem;
    color: var(--text-dim);
    padding: .7rem 1.5rem 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem;
  }

  .row { display: flex; gap: .6rem; margin-bottom: 1.1rem; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem; font-weight: 600; color: #fff;
    background: var(--idle);
  }
  .avatar.user { background: var(--text); }
  .avatar.assistant { background: var(--index); }

  .bubble-wrap { max-width: 72%; }
  .row.user .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }

  .bubble {
    padding: .55rem .8rem;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: .88rem;
    line-height: 1.5;
  }
  .row.user .bubble { background: var(--text); color: #fff; border-color: var(--text); white-space: pre-wrap; }

  /* Rendered markdown inside assistant bubbles */
  .bubble p { margin: 0 0 .6rem; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 .6rem; padding-left: 1.2rem; }
  .bubble code { background: var(--bg); border-radius: 4px; padding: .1rem .3rem; font-size: .82em; }
  .bubble pre { background: var(--bg); border-radius: 6px; padding: .6rem .7rem; overflow-x: auto; margin: 0 0 .6rem; }
  .bubble pre code { background: none; padding: 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 0 0 .6rem; font-size: .82rem; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: .35rem .5rem; text-align: left; }
  .bubble th { background: var(--bg); font-weight: 600; }

  .sources {
    margin-top: .5rem;
    font-size: .72rem;
    color: var(--text-dim);
  }
  .source-chip {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .08rem .4rem;
    margin: .1rem .2rem 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: .68rem;
  }

  .feedback { display: inline-flex; gap: .3rem; align-items: center; }
  .fb-btn {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    padding: .15rem .5rem; font-size: .72rem; color: var(--text-dim); cursor: pointer;
  }
  .fb-btn:hover { border-color: var(--text); color: var(--text); }
  .fb-cat {
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
    padding: .12rem .55rem; font-size: .7rem; color: var(--text-dim); cursor: pointer;
  }
  .fb-cat:hover { border-color: var(--fail); color: var(--fail); }
  .fb-cat.fb-skip { border-style: dashed; }
  .feedback-thanks { font-size: .72rem; color: var(--text-dim); font-style: italic; }

  .generating {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-size: .8rem;
    color: var(--text-dim);
    padding: .3rem 0;
  }
  .generating .stage-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
  }
  .dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--embed); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }

  .badges { margin-top: .4rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .badge {
    font-size: .66rem;
    padding: .12rem .5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .badge.cache-exact, .badge.cache-semantic { border-color: var(--index); color: var(--index); }
  .badge.tool-vector_search { border-color: var(--intake); color: var(--intake); }
  .badge.tool-web_search { border-color: var(--embed); color: var(--embed); }
  .badge.tool-sandbox { border-color: var(--index); color: var(--index); }

  .previous-answer {
    margin-top: .5rem;
    padding: .5rem .7rem;
    border-left: 2px solid var(--idle);
    font-size: .8rem;
    color: var(--text-dim);
  }

  #chat-form {
    display: flex;
    gap: .5rem;
    padding: .9rem 1.5rem 1.1rem;
    border-top: 1px solid var(--border);
  }
  #chat-input {
    flex: 1;
    padding: .6rem .8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: .88rem;
    background: var(--surface);
  }
  #chat-input:focus { outline: none; border-color: var(--text); }
  button {
    border: none;
    border-radius: 8px;
    padding: .6rem 1.1rem;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 500;
    background: var(--text);
    color: #fff;
    cursor: pointer;
  }
  button:hover { opacity: .88; }

  /* ---------- Documents sidebar ---------- */
  #doc-col {
    flex: 0 0 35%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #doc-desc {
    font-size: .78rem;
    color: var(--text-dim);
    padding: .7rem 1.5rem 0;
  }
  #upload-zone {
    margin: .9rem 1.5rem;
    padding: .8rem;
    border: 1px dashed var(--border);
    border-radius: 8px;
    text-align: center;
  }
  #upload-zone input[type=file] { font-size: .78rem; max-width: 100%; }
  #upload-btn { margin-top: .5rem; width: 100%; }
  #upload-status { font-size: .74rem; color: var(--text-dim); margin-top: .5rem; min-height: 1.1em; }

  #doc-list { flex: 1; overflow-y: auto; padding: 0 1.5rem 1rem; }
  .doc-item {
    padding: .55rem 0;
    border-bottom: 1px solid var(--border);
  }
  .doc-item:last-child { border-bottom: none; }
  .doc-name { font-size: .82rem; font-weight: 500; word-break: break-word; }
  .doc-meta { display: flex; align-items: center; gap: .35rem; margin-top: .25rem; }
  .stage-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .doc-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: .68rem;
    text-transform: lowercase;
  }
  .doc-status.pending { color: var(--idle); }
  .doc-status.fetching, .doc-status.parsing { color: var(--intake); }
  .doc-status.embedding { color: var(--embed); }
  .doc-status.indexing, .doc-status.complete { color: var(--index); }
  .doc-status.failed { color: var(--fail); }
  .stage-dot.pending { color: var(--idle); }
  .stage-dot.fetching, .stage-dot.parsing { background: var(--intake); }
  .stage-dot.embedding { background: var(--embed); }
  .stage-dot.indexing, .stage-dot.complete { background: var(--index); }
  .stage-dot.failed { background: var(--fail); }
  .stage-dot.active { animation: pulse 1.1s ease-in-out infinite; }
  .doc-chunks { font-size: .68rem; color: var(--text-dim); }
  #doc-list .empty { font-size: .78rem; color: var(--text-dim); padding-top: .5rem; }

  @media (max-width: 720px) {
    main { flex-direction: column; }
    #chat-col { border-right: none; border-bottom: 1px solid var(--border); flex: 1 1 60%; }
    #doc-col { max-width: none; flex: 1 1 40%; }
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

<header>
  <h1>DocRAG</h1>
  <p> Agentic Hybrid Retrieval Over Your Documents.</p>
</header>

<main>
  <section id="chat-col">
    <div id="chat-desc">Ask questions about the documents in your corpus.</div>
    <div id="chat"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>

  <aside id="doc-col">
    <div id="doc-desc">Upload PDFs, DOCX, HTML, or Markdown to add them to your corpus.</div>
    <div id="upload-zone">
      <input type="file" id="file-input">
      <button id="upload-btn">Upload</button>
      <div id="upload-status"></div>
    </div>
    <div id="doc-list"><div class="empty">No documents yet.</div></div>
  </aside>
</main>

<script>
const chatEl = document.getElementById('chat');
const docListEl = document.getElementById('doc-list');
const uploadStatusEl = document.getElementById('upload-status');

// Friendly labels for the LangGraph node names streamed by chat/stream's status events.
const NODE_LABELS = {
  planner: 'Planning',
  retriever: 'Retrieving documents',
  tool: 'Using a tool',
  responder: 'Generating answer',
};

function initials(role) { return role === 'user' ? 'U' : 'AI'; }

// Strips the inline "[Source: X]" citation tags from rendered prose — shown instead as a
// clean chip list built from the `sources` array (see renderExtras below).
const SOURCE_TAG_RE = /\s*\[Source:[^\]]*\]/gi;

function renderMarkdown(text) {
  const stripped = text.replace(SOURCE_TAG_RE, '');
  const html = marked.parse(stripped, { breaks: true });
  return DOMPurify.sanitize(html);
}

async function initSession() {
  await fetch('/api/v1/session/init', { method: 'POST', credentials: 'include' });
}

function addMessage(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  row.innerHTML = `
    <div class="avatar ${role}">${initials(role)}</div>
    <div class="bubble-wrap"><div class="bubble"></div></div>
  `;
  const bubble = row.querySelector('.bubble');
  if (role === 'assistant') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text; // user input never needs markdown rendering
  }
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row.querySelector('.bubble-wrap');
}

function addGeneratingRow() {
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.innerHTML = `
    <div class="avatar assistant">AI</div>
    <div class="generating">
      <span class="dot-pulse"></span>
      <span class="stage-label">Thinking…</span>
    </div>
  `;
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function renderBadges(row, data) {
  // insertAdjacentHTML, not row.innerHTML += — the row already has renderFeedback's buttons
  // with live listeners, and += re-parses the whole element, silently destroying them.

  // backend_used is always populated ("none" when no LLM call was made); model_used is only
  // ever set alongside a real backend — combining them is always accurate.
  const backendLabel = data.backend_used || 'none';
  const modelLabel = data.model_used ? ` · ${data.model_used}` : '';
  row.insertAdjacentHTML('beforeend', `<span class="badge">${backendLabel}${modelLabel}</span>`);

  if (data.tool_used) {
    row.insertAdjacentHTML('beforeend', `<span class="badge tool-${data.tool_used}">${data.tool_used.replace('_',' ')}</span>`);
  } else {
    row.insertAdjacentHTML('beforeend', `<span class="badge">tool: none</span>`);
  }
  row.insertAdjacentHTML('beforeend', `<span class="badge cache-${data.cache_hit}">cache: ${data.cache_hit}</span>`);
}

function renderExtras(container, data) {
  // Distinct filenames only — the same document can appear more than once (one entry per chunk).
  const uniqueSources = [...new Set(data.sources || [])];
  if (uniqueSources.length > 0) {
    const src = document.createElement('div');
    src.className = 'sources';
    src.innerHTML = 'Sources: ' + uniqueSources.map(s => `<span class="source-chip">${s}</span>`).join('');
    container.appendChild(src);
  }

  if (data.previous_answer) {
    const prev = document.createElement('div');
    prev.className = 'previous-answer';
    prev.innerHTML = `<strong>Earlier answer (v${data.previous_answer.corpus_version}):</strong> ` + renderMarkdown(data.previous_answer.content);
    container.appendChild(prev);
  }
}

const FEEDBACK_CATEGORIES = [
  { key: 'inaccurate', label: 'Inaccurate' },
  { key: 'not_relevant', label: 'Not relevant' },
  { key: 'incomplete', label: 'Incomplete' },
  { key: 'harmful', label: 'Harmful' },
];

async function submitFeedback(messageId, score, category, container) {
  try {
    await fetch('/api/v1/feedback/', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message_id: messageId, score, category: category || null }),
    });
  } catch (err) {
    console.error('Feedback submit failed:', err);
  }
  container.innerHTML = '<span class="feedback-thanks">Thanks for the feedback.</span>';
}

function renderFeedback(row, messageId) {
  if (messageId == null) return; // cache-hit paths always have one; defensive only

  const wrap = document.createElement('span');
  wrap.className = 'feedback';
  wrap.innerHTML = `
    <button class="fb-btn fb-up" title="Good response">&#128077;</button>
    <button class="fb-btn fb-down" title="Bad response">&#128078;</button>
  `;

  wrap.querySelector('.fb-up').addEventListener('click', () => {
    submitFeedback(messageId, 1, null, wrap);
  });

  wrap.querySelector('.fb-down').addEventListener('click', () => {
    // Expands in place instead of a modal, so it doesn't interrupt the chat flow.
    wrap.innerHTML = FEEDBACK_CATEGORIES.map(c =>
      `<button class="fb-cat" data-key="${c.key}">${c.label}</button>`
    ).join('') + '<button class="fb-cat fb-skip">Skip</button>';

    wrap.querySelectorAll('.fb-cat').forEach(btn => {
      btn.addEventListener('click', () => {
        const category = btn.classList.contains('fb-skip') ? null : btn.dataset.key;
        submitFeedback(messageId, -1, category, wrap);
      });
    });
  });

  row.insertBefore(wrap, row.firstChild); // feedback first in the row, badges after
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  addMessage('user', message);

  const generatingRow = addGeneratingRow();
  const stageLabelEl = generatingRow.querySelector('.stage-label');

  const resp = await fetch('/api/v1/chat/stream', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.trim()) continue;
      const data = JSON.parse(line);

      if (data.type === 'status') {
        // Swaps the label on one live indicator rather than stacking a growing log.
        stageLabelEl.textContent = (NODE_LABELS[data.node] || data.node) + '…';
      } else if (data.type === 'answer') {
        generatingRow.remove();
        const wrap = addMessage('assistant', data.content);
        const row = document.createElement('div');
        row.className = 'badges';
        wrap.appendChild(row);
        renderFeedback(row, data.message_id);  // inserted first within the row
        renderBadges(row, data);               // appended after
        renderExtras(wrap, data);               // sources / previous-answer stay as separate lines below
      } else if (data.type === 'error') {
        generatingRow.remove();
        addMessage('assistant', 'Error: ' + data.content);
      }
    }
  }
});

async function refreshDocList() {
  const resp = await fetch('/api/v1/corpus/documents', { credentials: 'include' });
  if (!resp.ok) return;
  const docs = await resp.json();
  if (docs.length === 0) {
    docListEl.innerHTML = '<div class="empty">No documents yet.</div>';
    return;
  }
  docListEl.innerHTML = docs.map(d => {
    const active = !['complete', 'failed'].includes(d.status);
    return `
      <div class="doc-item">
        <div class="doc-name">${d.filename}</div>
        <div class="doc-meta">
          <span class="stage-dot ${d.status}${active ? ' active' : ''}"></span>
          <span class="doc-status ${d.status}">${d.status}</span>
          ${d.chunk_count != null ? `<span class="doc-chunks">· ${d.chunk_count} chunks</span>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function pollIngestStatus(fileId, filename) {
  const poll = async () => {
    const resp = await fetch(`/api/v1/ingest/status/${fileId}`, { credentials: 'include' });
    if (!resp.ok) return;
    const data = await resp.json();
    uploadStatusEl.textContent = `${filename}: ${data.status}`;
    await refreshDocList();
    if (data.status === 'complete' || data.status === 'failed') return;
    setTimeout(poll, 1500);
  };
  poll();
}

document.getElementById('upload-btn').addEventListener('click', async () => {
  const fileInput = document.getElementById('file-input');
  const file = fileInput.files[0];
  if (!file) return;

  uploadStatusEl.textContent = 'Requesting upload URL...';
  const contentType = file.type || 'application/octet-stream';
  const presignResp = await fetch('/api/v1/upload/generate-presigned-url', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: file.name, content_type: contentType }),
  });
  const { upload_url, file_id, corpus_id } = await presignResp.json();

  uploadStatusEl.textContent = 'Uploading...';
  // Must match the Metadata signed into the presigned URL exactly, or MinIO rejects the PUT.
  // corpus_id comes from the presign response, not document.cookie — the session cookie is
  // httpOnly and invisible to JS.
  const putResp = await fetch(upload_url, {
    method: 'PUT',
    body: file,
    headers: {
      'Content-Type': contentType,
      'x-amz-meta-original_filename': file.name,
      'x-amz-meta-corpus_id': corpus_id,
    },
  });
  if (!putResp.ok) {
    uploadStatusEl.textContent = `Upload failed (${putResp.status}) — check console.`;
    console.error('PUT to presigned URL failed:', putResp.status, await putResp.text());
    return;
  }

  uploadStatusEl.textContent = `${file.name}: pending`;
  pollIngestStatus(file_id, file.name);
});

initSession().then(refreshDocList);
</script>
</body>
</html>
