name: omnirag

# Local development services. Each one belongs to a profile, so the ones you need for start: make up PROFILE=core,cache
# The API runs on your host machine (make dev), not in Docker, which is why every port is published to localhost.
services:
  # Chat history database (profile: core)
  postgres:
    image: postgres:15-alpine
    container_name: omnirag-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: omnirag
      POSTGRES_PASSWORD: omnirag_dev_password
      POSTGRES_DB: omnirag_db
    ports:
      - "5432:5432"
    volumes:
      - omnirag_pg_data:/var/lib/postgresql/data

  # Session storage and response cache (profile: cache). One container serves both uses.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: omnirag-redis
    profiles: ["cache"]
    ports:
      - "6379:6379"
    mem_limit: 512m

  # Vector database for embeddings and search (profile: vector)
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: omnirag-qdrant
    profiles: ["vector"]
    ports:
      - "6333:6333"
    volumes:
      - omnirag_qdrant_data:/qdrant/storage

  # Isolated service for running generated code (profile: sandbox)
  sandbox:
    build: ./services/sandbox
    container_name: omnirag-sandbox
    profiles: ["sandbox"]
    ports:
      - "8080:8080"
    mem_limit: 256m
    # Note: outbound network access is not blocked here. The egress restriction is a Kubernetes NetworkPolicy and has no Docker Compose equivalent, so treat this sandbox as local-only.

  # S3-compatible object storage for uploaded documents (profile: storage)
  minio:
    image: minio/minio
    container_name: omnirag-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: omnirag_admin
      MINIO_ROOT_PASSWORD: omnirag_dev_password
    volumes:
      - omnirag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-time setup for MinIO (profile: storage). Creates the bucket and sends an upload notification to the API for every new file. 
  # host.docker.internal lets the container reach the API on your host, and extra_hosts makes that name work on Linux too.
  minio-init:
    image: minio/mc
    container_name: omnirag-minio-init
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Keeps retrying until the API is running, since the webhook can't be registered while its endpoint is unreachable.
    entrypoint: >
      sh -c '
      mc alias set local http://minio:9000 omnirag_admin omnirag_dev_password &&
      mc mb --ignore-existing local/omnirag-corpus &&
      until mc admin config set local notify_webhook:1 endpoint="http://host.docker.internal:8000/api/v1/webhooks/minio"; do
        echo "FastAPI webhook not ready; retrying in 3 seconds...";
        sleep 3;
      done &&
      echo "Webhook configuration successful."
      '

volumes:
  omnirag_pg_data:
  omnirag_qdrant_data:
  omnirag_minio_data: