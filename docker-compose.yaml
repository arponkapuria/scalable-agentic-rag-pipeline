name: omnirag

services:
  # 1. Postgres (Chat History) — profile: core
  postgres:
    image: postgres:15-alpine
    container_name: omnirag-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: omnirag
      POSTGRES_PASSWORD: omnirag_dev_password
      POSTGRES_DB: omnirag_db
    ports:
      - "5432:5432"
    volumes:
      - omnirag_pg_data:/var/lib/postgresql/data

  # 2. Redis (Session storage + cache) — profile: cache
  # Needed as early as Phase 2 (session storage), not just Phase 5 (caching) — same
  # container, two uses, brought up once under one profile.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: omnirag-redis
    profiles: ["cache"]
    ports:
      - "6379:6379"
    mem_limit: 512m

  # 3. Qdrant (Vector DB) — profile: vector
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: omnirag-qdrant
    profiles: ["vector"]
    ports:
      - "6333:6333"
    volumes:
      - omnirag_qdrant_data:/qdrant/storage

  # Sandbox code-exec service — profile: sandbox. Was never added here
  # despite PROJECT_INSTRUCTIONS.md's profile table and Phase 6 both
  # listing it as required; sandbox.py's hardcoded K8s-only hostname
  # ("sandbox-service") also could never have resolved from a host-run
  # `make dev` process even if this block had existed — see config.py's
  # SANDBOX_URL comment. Port published to localhost, matching every
  # other local service here, since the API runs on the HOST, not in
  # Docker, for local dev.
  sandbox:
    build: ./services/sandbox
    container_name: omnirag-sandbox
    profiles: ["sandbox"]
    ports:
      - "8080:8080"
    mem_limit: 256m
    # network-policy.yaml's egress-deny is a K8s NetworkPolicy resource —
    # has no Docker Compose equivalent, so it is NOT enforced locally.
    # This is a real, known gap for the local/demo build (PROJECT_INSTRUCTIONS.md
    # flags this exact requirement) — tracked in PROGRESS.md's Open Problems,
    # not silently ignored.

  # 4. MinIO (S3-compatible object storage) — profile: storage
  minio:
    image: minio/minio
    container_name: omnirag-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: omnirag_admin
      MINIO_ROOT_PASSWORD: omnirag_dev_password
    volumes:
      - omnirag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5b. One-shot: bucket + webhook event-notification setup (profile: storage)
  # MinIO's webhook notification target POSTs the same S3-event schema AWS
  # uses, so s3_event_handler.py's handle_s3_event() works for both — this
  # just wires MinIO to call the API's receiver route on every upload.
  # host.docker.internal reaches the host's FastAPI process (`make dev`
  # runs uvicorn on the host, not in a container) from inside this
  # container; extra_hosts makes that resolve on Linux too, not just
  # Docker Desktop.
  minio-init:
    image: minio/mc
    container_name: omnirag-minio-init
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: >
      sh -c '
      mc alias set local http://minio:9000 omnirag_admin omnirag_dev_password &&
      mc mb --ignore-existing local/omnirag-corpus &&
      until mc admin config set local notify_webhook:1 endpoint="http://host.docker.internal:8000/api/v1/webhooks/minio"; do
        echo "FastAPI webhook not ready; retrying in 3 seconds...";
        sleep 3;
      done &&
      echo "Webhook configuration successful."
      '

volumes:
  omnirag_pg_data:
  omnirag_qdrant_data:
  omnirag_minio_data: