# Reference only — not loaded by the app at runtime. Source of truth: .env / config.py.

# Dense embedder — FastEmbed, ONNX/CPU, $0. Originally speced as bge-m3; FastEmbed doesn't ship that model, this is the closest real substitute.
model_id: BAAI/bge-large-en-v1.5
dimensions: 1024
distance_metric: cosine
cache_dir: ~/.cache/fastembed