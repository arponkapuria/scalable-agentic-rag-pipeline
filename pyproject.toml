[project]
name = "omnirag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.63",
    "tqdm>=4.67.3",
    "httpx>=0.28.1",
]

[dependency-groups]
api = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "uvicorn[standard]>=0.41.0",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "qdrant-client>=1.17.0",
    "langgraph>=1.1.4",
]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
ingestion = [
    "qdrant-client>=1.17.0",
    "fastembed>=0.8.0",
    # --- Docling (parser/chunker, loaders/docling_loader.py) ---
    # Full `docling`, not docling-slim+curated extras — two rounds of
    # missing-transitive-dependency import errors (rtree, among others)
    # showed Docling's base pipeline modules (OCR factory, spatial
    # indexing) get imported regardless of which slim extras are
    # selected, so hand-picking extras was fighting the package for no
    # real savings. ONNX-runtime layout/picture-classifier config lives
    # in docling_loader.py — full `docling` ships both the onnxruntime
    # and torch engine options, we just select onnxruntime in code.
    "docling",
    # HybridChunker's tokenizer — separate from docling-core[chunking]'s
    # own deps per Docling's own hybrid-chunking examples, which install
    # it explicitly alongside docling.
    "transformers>=4.40.0",
]
eval = [
    # RAGAS's real metric implementations (Faithfulness, AnswerRelevancy,
    # ContextPrecisionWithoutReference, ContextRecall, AnswerCorrectness)
    # for Phase 9a (eval/). Scoped to its own group, deliberately never
    # pulled into the `api` group's install: `pip install ragas` drags in
    # ~30 packages (langchain, langchain-community, langchain-text-splitters,
    # langgraph-prebuilt/-sdk, langchain_openai, openai SDK, datasets,
    # pyarrow, huggingface-hub, instructor, tiktoken...) — several of
    # these are the exact packages (langchain, langchain-community,
    # langchain-text-splitters) removed from this list during the
    # Neo4j/Ray cleanup. None of it touches the deployed api service;
    # `uv sync --group eval` (or `pip install "ragas>=0.4.3,<0.5"`) only
    # when actually running the eval.
    # Verified live: ragas 0.4.3's own ragas/llms/base.py unconditionally
    # imports langchain_community.chat_models.vertexai.ChatVertexAI, a
    # submodule current langchain-community releases no longer ship
    # (deprecated/moved) — `import ragas` fails on a clean install as of
    # this writing. eval/_ragas_compat.py works around it (we never use
    # VertexAI); see that file's docstring and eval/RUNBOOK.md.
    "ragas>=0.4.3,<0.5",
]