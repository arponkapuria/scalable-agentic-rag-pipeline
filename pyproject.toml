[project]
name = "omnirag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.63",
    "tqdm>=4.67.3",
    "httpx>=0.28.1",
]

[dependency-groups]
api = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "uvicorn[standard]>=0.41.0",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "qdrant-client>=1.17.0",
    "langgraph>=1.1.4",
]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
ingestion = [
    "qdrant-client>=1.17.0",
    "fastembed>=0.8.0",
    # --- Docling (parser/chunker, loaders/docling_loader.py) ---
    # Full `docling`, not docling-slim+curated extras — two rounds of
    # missing-transitive-dependency import errors (rtree, among others)
    # showed Docling's base pipeline modules (OCR factory, spatial
    # indexing) get imported regardless of which slim extras are
    # selected, so hand-picking extras was fighting the package for no
    # real savings. ONNX-runtime layout/picture-classifier config lives
    # in docling_loader.py — full `docling` ships both the onnxruntime
    # and torch engine options, we just select onnxruntime in code.
    "docling",
    # HybridChunker's tokenizer — separate from docling-core[chunking]'s
    # own deps per Docling's own hybrid-chunking examples, which install
    # it explicitly alongside docling.
    "transformers>=4.40.0",
]
observability = [
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
]
